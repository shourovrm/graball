<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>downloader-app · UI mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
/* ---------- design tokens (dark M3, restrained: burnt-orange primary on pure neutral) ---------- */
:root{
  --bg:        oklch(0.115 0 0);
  --surface:   oklch(0.165 0.004 40);
  --surface-2: oklch(0.21 0.005 40);
  --surface-3: oklch(0.26 0.006 40);
  --outline:   oklch(0.33 0.006 40);
  --ink:       oklch(0.93 0.004 45);
  --muted:     oklch(0.68 0.007 45);
  --primary:   oklch(0.76 0.13 40);
  --on-primary:oklch(0.23 0.06 40);
  --primary-container: oklch(0.34 0.075 40);
  --on-primary-container: oklch(0.90 0.07 45);
  --accent:    oklch(0.80 0.09 200);
  --good:      oklch(0.78 0.13 150);
  --bad:       oklch(0.74 0.15 25);
  --bad-container: oklch(0.30 0.09 25);
  /* radius system: sheets 28 / cards 12 / chips 8 / buttons pill — M3 convention */
  --r-sheet: 28px; --r-card: 12px; --r-chip: 8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background: oklch(0.08 0 0);
  color: var(--ink);
  font-family: Roboto, system-ui, sans-serif;
  padding: 48px 32px 64px;
}
.ms{
  font-family:'Material Symbols Rounded';
  font-weight:normal;font-style:normal;line-height:1;
  letter-spacing:normal;text-transform:none;display:inline-block;
  white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;
  font-variation-settings:'opsz' 24,'wght' 400;
  font-size:22px; user-select:none;
}
.ms.fill{font-variation-settings:'FILL' 1,'opsz' 24}
.ms.sm{font-size:18px}
.ms.xs{font-size:15px}

/* ---------- gallery shell ---------- */
header.gallery{max-width:1100px;margin:0 auto 40px}
header.gallery h1{font-size:1.5rem;font-weight:500;letter-spacing:-0.01em}
header.gallery p{color:var(--muted);margin-top:6px;max-width:65ch;line-height:1.5}
.frames{display:flex;flex-wrap:wrap;gap:44px;justify-content:center}
figure{display:flex;flex-direction:column;gap:12px}
figcaption{color:var(--muted);font-size:0.85rem;text-align:center}

/* ---------- phone frame ---------- */
.phone{
  width:412px;height:892px;
  background:var(--bg);
  border-radius:30px;
  border:1px solid oklch(0.28 0 0);
  overflow:hidden;position:relative;
  display:flex;flex-direction:column;
  font-size:15px;
}
.statusbar{
  height:36px;flex:none;display:flex;align-items:center;
  justify-content:space-between;padding:0 18px;font-size:13px;font-weight:500;
}
.statusbar .right{display:flex;gap:5px;align-items:center}
.statusbar .ms{font-size:15px}
.gesture{
  height:22px;flex:none;display:flex;align-items:center;justify-content:center;
}
.gesture::before{content:"";width:120px;height:4px;border-radius:2px;background:oklch(0.45 0 0)}
.screen{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}

/* ---------- shared M3 components ---------- */
.appbar{
  height:64px;flex:none;display:flex;align-items:center;gap:20px;padding:0 16px;
}
.appbar .title{font-size:1.25rem;font-weight:400}
.appbar .spacer{flex:1}
.appbar .ms{color:var(--ink)}
.iconbtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}

.btn{
  border:none;font:inherit;font-weight:500;font-size:14px;
  height:40px;padding:0 24px;border-radius:20px;
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
  cursor:pointer;
}
.btn.filled{background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:var(--primary-container);color:var(--on-primary-container)}
.btn.text{background:none;color:var(--primary);padding:0 12px}
.btn.outlined{background:none;color:var(--primary);border:1px solid var(--outline)}

.chip{
  height:32px;padding:0 14px;border-radius:var(--r-chip);
  border:1px solid var(--outline);color:var(--ink);
  display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:500;
  flex:none;
}
.chip .count{color:var(--muted);font-weight:400}
.chip.sel{background:var(--primary-container);border-color:transparent;color:var(--on-primary-container)}
.chip.sel .count{color:var(--on-primary-container);opacity:0.75}
.chip .ms{font-size:17px}

.card{background:var(--surface);border-radius:var(--r-card)}

/* segmented fragment bar (DownThemAll style) */
.segbar{display:flex;gap:2px;height:6px}
.segbar i{flex:1;border-radius:1.5px;background:var(--surface-3)}
.segbar i.f{background:var(--primary)}
.segbar i.p{background:linear-gradient(90deg,var(--primary) 55%,var(--surface-3) 55%)}
.segbar i.p2{background:linear-gradient(90deg,var(--primary) 25%,var(--surface-3) 25%)}

/* indeterminate progress */
.linprog{height:4px;border-radius:2px;background:var(--primary-container);overflow:hidden;position:relative}
.linprog::after{
  content:"";position:absolute;inset:0;width:35%;border-radius:2px;background:var(--primary);
  animation:indet 1.4s cubic-bezier(0.65,0,0.35,1) infinite;
}
@keyframes indet{from{transform:translateX(-110%)}to{transform:translateX(400%)}}
@media (prefers-reduced-motion: reduce){.linprog::after{animation:none;width:100%;opacity:0.5}}

.checkbox{
  width:20px;height:20px;border-radius:4px;border:2px solid var(--muted);flex:none;
}
.checkbox.on{
  background:var(--primary);border-color:var(--primary);position:relative;
}
.checkbox.on::after{
  content:"check";font-family:'Material Symbols Rounded';font-size:16px;font-weight:700;
  color:var(--on-primary);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:none}
.radio.on{border-color:var(--primary);position:relative}
.radio.on::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--primary)}

/* ============ F1 · share sheet ============ */
.hostapp{position:absolute;inset:0;background:oklch(0.14 0.01 260);filter:brightness(0.45)}
.hostapp .bar{height:56px;background:oklch(0.2 0.015 260);display:flex;align-items:center;padding:0 16px;gap:12px;color:oklch(0.6 0.01 260)}
.hostapp .blk{background:oklch(0.22 0.012 260);border-radius:8px;margin:14px 16px}
.scrim{position:absolute;inset:0;background:oklch(0 0 0 / 0.45)}
.sheet{
  position:absolute;left:0;right:0;bottom:0;
  background:var(--surface);border-radius:var(--r-sheet) var(--r-sheet) 0 0;
  padding:8px 24px 16px;
}
.sheet .handle{width:32px;height:4px;border-radius:2px;background:var(--muted);opacity:0.5;margin:8px auto 20px}
.srcrow{display:flex;align-items:center;gap:14px}
.favicon{
  width:44px;height:44px;border-radius:50%;background:var(--primary-container);
  color:var(--on-primary-container);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:19px;flex:none;
}
.srcrow .dom{font-weight:500;font-size:16px}
.srcrow .url{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:250px}
.enginechip{
  margin-left:auto;flex:none;height:26px;padding:0 10px;border-radius:13px;
  background:var(--surface-2);color:var(--muted);font-size:12px;font-weight:500;
  display:flex;align-items:center;gap:5px;
}
.resolve{margin:26px 0 8px}
.resolve .label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:10px}
.resolve .label b{font-weight:500}
.resolve .label span{color:var(--muted)}
.sheetactions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}

/* ============ F2 · picker ============ */
.ctxbar{
  height:64px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px;
  background:var(--surface-2);
}
.ctxbar .n{font-size:1.15rem;font-weight:400;margin-left:4px}
.ctxbar .spacer{flex:1}
.searchrow{padding:12px 16px 4px}
.search{
  height:48px;border-radius:24px;background:var(--surface-2);
  display:flex;align-items:center;gap:12px;padding:0 18px;color:var(--muted);font-size:14.5px;
}
.search .q{color:var(--ink)}
.search .caret{width:1.5px;height:18px;background:var(--primary);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.search .caret{animation:none}}
.chiprow{display:flex;gap:8px;padding:12px 16px 4px;overflow:hidden}
.sortrow{display:flex;align-items:center;gap:6px;padding:10px 20px 6px;color:var(--muted);font-size:13px}
.sortrow b{color:var(--ink);font-weight:500}
.list{flex:1;overflow:hidden;padding:4px 0}
.row{display:flex;align-items:center;gap:14px;padding:11px 16px;min-height:60px}
.row .ticon{
  width:40px;height:40px;border-radius:10px;background:var(--surface-2);flex:none;
  display:flex;align-items:center;justify-content:center;color:var(--muted);
}
.row.sel{background:oklch(0.34 0.075 40 / 0.28)}
.row.sel .ticon{background:var(--primary-container);color:var(--on-primary-container)}
.row .body{flex:1;min-width:0}
.row .name{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.row .ms.chev{color:var(--muted)}
.variants{background:var(--surface);margin:0 16px 8px 70px;border-radius:var(--r-card);overflow:hidden}
.vrow{display:flex;align-items:center;gap:12px;padding:10px 16px;font-size:13.5px}
.vrow .sz{margin-left:auto;color:var(--muted);font-size:12.5px}
.vrow.on{background:oklch(0.34 0.075 40 / 0.28)}
.pickerfoot{
  flex:none;padding:12px 16px 10px;background:var(--surface);
  border-radius:var(--r-sheet) var(--r-sheet) 0 0;
  display:flex;align-items:center;gap:12px;
}
.pickerfoot .btn.filled{flex:1;height:48px;border-radius:24px;font-size:15px}

/* ============ F3 · downloads ============ */
.dlcard{margin:6px 16px;padding:14px 16px}
.dlhead{display:flex;align-items:flex-start;gap:12px}
.dlhead .body{flex:1;min-width:0}
.dlhead .name{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlhead .meta{color:var(--muted);font-size:12.5px;margin-top:3px}
.dlhead .ms{color:var(--muted)}
.dlcard .segbar{margin:12px 0 8px}
.dlstats{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px}
.dlstats b{color:var(--ink);font-weight:500}
.state{font-size:12.5px;font-weight:500;letter-spacing:0.02em}
.state.run{color:var(--primary)}
.state.mux{color:var(--accent)}
.state.done{color:var(--good)}
.state.fail{color:var(--bad)}
.failbox{
  margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--bad-container);
  font-size:13.5px;line-height:1.45;
}
.failactions{display:flex;gap:4px;margin-top:8px;margin-left:-12px}
.failactions .btn.text{height:36px;font-size:13.5px}
.failactions .btn.text.err{color:oklch(0.85 0.09 25)}
.donemeta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;margin-top:10px}
.sectionlabel{padding:16px 20px 6px;color:var(--muted);font-size:12.5px;font-weight:500}

/* ============ F4 · browser + sniffer ============ */
.urlbar{
  margin:8px 16px;height:48px;border-radius:24px;background:var(--surface-2);
  display:flex;align-items:center;gap:10px;padding:0 16px;font-size:14px;
}
.urlbar .lock{color:var(--muted)}
.webview{flex:1;background:oklch(0.97 0.002 80);color:oklch(0.25 0.01 80);overflow:hidden;padding:20px 18px}
.webview h2{font-size:19px;line-height:1.3;font-weight:700;letter-spacing:-0.01em}
.webview .byline{font-size:12px;color:oklch(0.5 0.01 80);margin:8px 0 14px}
.webview .vidthumb{
  aspect-ratio:16/9;border-radius:8px;position:relative;overflow:hidden;
  background:linear-gradient(140deg,oklch(0.62 0.09 250),oklch(0.35 0.07 280) 55%,oklch(0.2 0.05 300));
}
.webview .vidthumb .play{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
}
.webview .vidthumb .play i{
  width:56px;height:56px;border-radius:50%;background:oklch(0 0 0/0.55);color:#fff;
  display:flex;align-items:center;justify-content:center;
}
.webview .vidthumb .dur{
  position:absolute;right:8px;bottom:8px;background:oklch(0 0 0/0.7);color:#fff;
  font-size:11px;padding:2px 6px;border-radius:4px;
}
.webview p{font-size:13.5px;line-height:1.55;margin-top:12px}
.webview .thumbrow{display:flex;gap:10px;margin-top:14px}
.webview .thumbrow div{flex:1;aspect-ratio:4/3;border-radius:6px}
.webview .thumbrow div:nth-child(1){background:linear-gradient(160deg,oklch(0.75 0.1 60),oklch(0.5 0.12 40))}
.webview .thumbrow div:nth-child(2){background:linear-gradient(160deg,oklch(0.7 0.09 160),oklch(0.4 0.08 180))}
.webview .thumbrow div:nth-child(3){background:linear-gradient(160deg,oklch(0.65 0.06 250),oklch(0.4 0.06 270))}
.fab{
  position:absolute;right:18px;bottom:88px;
  width:56px;height:56px;border-radius:16px;background:var(--primary);color:var(--on-primary);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 8px oklch(0 0 0/0.4);
}
.fab .badge{
  position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;
  background:var(--bad);color:#fff;font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 6px;
  border:2px solid var(--bg);
}
.snack{
  position:absolute;left:16px;right:16px;bottom:16px;
  background:var(--surface-3);border-radius:8px;padding:14px 16px;
  display:flex;align-items:center;gap:12px;font-size:13.5px;
  box-shadow:0 2px 6px oklch(0 0 0/0.5);
}
.snack .act{margin-left:auto;color:var(--primary);font-weight:500;flex:none}

/* ============ F5 · settings ============ */
.setgroup{margin:4px 16px 12px}
.setrow{display:flex;align-items:center;gap:16px;padding:14px 16px;min-height:64px}
.setrow + .setrow{border-top:1px solid oklch(0.24 0.004 40)}
.setrow .ms{color:var(--muted);flex:none}
.setrow .body{flex:1;min-width:0}
.setrow .t{font-size:14.5px}
.setrow .d{color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.4}
.setrow .btn{flex:none}
.switch{width:48px;height:28px;border-radius:14px;background:var(--surface-3);border:2px solid var(--outline);flex:none;position:relative}
.switch::after{content:"";position:absolute;top:2px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted)}
.switch.on{background:var(--primary);border-color:var(--primary)}
.switch.on::after{left:auto;right:2px;background:var(--on-primary);width:22px;height:22px;top:0}
.domrow{display:flex;align-items:center;gap:12px;padding:11px 16px}
.domrow .favicon{width:36px;height:36px;font-size:15px}
.domrow .body{flex:1}
.domrow .t{font-size:14px}
.domrow .d{color:var(--muted);font-size:12.5px}
</style>
</head>
<body>

<header class="gallery">
  <h1>downloader-app · UI mockups</h1>
  <p>Dark Material 3, burnt-orange primary on neutral near-black. Five core surfaces of the share-sheet-first flow: resolve, pick, download, sniff, configure.</p>
</header>

<div class="frames">

<!-- ================= F1 · SHARE SHEET ================= -->
<figure>

</figure>

<!-- ================= F2 · PICKER ================= -->
<figure>
<div class="phone" id="f2">
  <div class="statusbar">
    <span>14:32</span>
    <span class="right"><span class="ms">signal_cellular_alt</span><span class="ms">wifi</span><span class="ms">battery_5_bar</span></span>
  </div>
  <div class="screen">

  <div class="gesture"></div>
</div>
<figcaption>2 · DownThemAll-style picker: filter chips, multi-select, expandable variants</figcaption>
